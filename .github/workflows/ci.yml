name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "37 9 * * 1"
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: brew install cmake pkg-config
      - run: python3 scripts/audit-llama.py
      - name: Build pinned llama.cpp
        run: scripts/bootstrap-llama.sh
      - name: Test and build
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/.build/llama-install/lib/pkgconfig
        run: |
          swift test
          swift build -c release
          bash -n scripts/package-macos.sh
          python3 -m py_compile examples/python_chatbot.py
